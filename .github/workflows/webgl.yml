# Builds the browser (WebGL) version on every push to main and publishes it to GitHub Pages.
# One-time setup (repository Settings):
#   - Pages > Build and deployment > Source: GitHub Actions
#   - Secrets and variables > Actions > New repository secret:
#       UNITY_LICENSE  = contents of C:\ProgramData\Unity\Unity_lic.ulf
#       UNITY_EMAIL    = Unity account email
#       UNITY_PASSWORD = Unity account password
name: WebGL build

on:
  push:
    branches: [main]
    # Documentation changes do not change the game.
    paths-ignore:
      - 'Docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: webgl-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space for the Unity image
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          # Only the fast deletions; uninstalling apt packages and docker images took most of the 2+ minutes.
          tool-cache: false
          large-packages: false
          docker-images: false
          swap-storage: false

      - uses: actions/checkout@v4
        with:
          lfs: true

      # Imported assets are cached; compiled scripts and the Unity Data Store are not.
      - uses: actions/cache@v4
        with:
          path: |
            Library
            !Library/ScriptAssemblies
            !Library/PlayerScriptAssemblies
            !Library/Bee
            !Library/DataStore
          key: Library-WebGL-v3-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}-${{ github.sha }}
          restore-keys: |
            Library-WebGL-v3-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}-
            Library-WebGL-v3-

      - name: Build WebGL
        id: build
        # With Unity 6000.6 the editor is sometimes killed (exit code 137) right after it starts, with or without
        # a cache; it is random, so the next step simply tries once more.
        continue-on-error: true
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildMethod: RPG.EditorTools.BuildMenu.BuildWebGLFromCommandLine

      - name: Remove a partial build
        if: steps.build.outcome == 'failure'
        run: sudo rm -rf Builds

      - name: Build WebGL again
        if: steps.build.outcome == 'failure'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildMethod: RPG.EditorTools.BuildMenu.BuildWebGLFromCommandLine
          # The first attempt already regenerated the scene, so the working tree is not clean any more.
          allowDirtyBuild: true

      - name: Add .nojekyll
        run: sudo touch Builds/WebGL/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: Builds/WebGL

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
